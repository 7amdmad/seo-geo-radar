name: Checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for HTML checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTML checker
        run: pip install djlint==1.46.1

      - name: Check HTML rules
        run: djlint index.html editions/*/index.html

      - name: Check HTML formatting
        run: djlint --check index.html editions/*/index.html

      - name: Test static pages
        run: node --test
